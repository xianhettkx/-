<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>小鶴神 · 自动投注控制台 v3.0</title>
    <style>
        :root {
            --bg: #0a0e17; --card: #141b24; --card-hover: #1a2332; --border: #1e2d3d;
            --text: #e0e6ed; --text-secondary: #8899aa; --primary: #3b82f6;
            --primary-hover: #2563eb; --success: #10b981; --success-bg: rgba(16,185,129,0.15);
            --danger: #ef4444; --danger-bg: rgba(239,68,68,0.15); --warning: #f59e0b;
            --warning-bg: rgba(245,158,11,0.15); --purple: #8b5cf6; --purple-bg: rgba(139,92,246,0.15);
            --radius: 10px; --radius-sm: 6px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .topbar .logo { font-size: 18px; font-weight: 700; color: var(--primary); }
        .topbar .logo span { color: var(--text); margin-left: 4px; font-size: 14px; }
        .topbar-right { display: flex; align-items: center; gap: 12px; }
        .account-indicator { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--bg); border-radius: 20px; border: 1px solid var(--border); font-size: 12px; }
        .account-indicator .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
        .account-indicator .dot.online { background: var(--success); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .main-container { max-width: 800px; margin: 0 auto; padding: 16px 12px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
        .card-title .icon { font-size: 18px; }
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 5px; font-weight: 500; }
        .form-input, .form-select { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; font-family: inherit; }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--primary); }
        .btn { padding: 10px 18px; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn-primary { background: var(--primary); color: #fff; width: 100%; padding: 12px; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-success { background: var(--success); color: #fff; width: 100%; padding: 12px; }
        .btn-danger { background: var(--danger); color: #fff; width: 100%; padding: 12px; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .hidden { display: none !important; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .tag-success { background: var(--success-bg); color: var(--success); }
        .tag-danger { background: var(--danger-bg); color: var(--danger); }
        .tag-purple { background: var(--purple-bg); color: var(--purple); }
        .tag-warning { background: var(--warning-bg); color: var(--warning); }

        /* 最新开奖条 */
        .latest-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--card); border-radius: var(--radius-sm); margin-bottom: 16px; border: 1px solid var(--border); }
        .latest-bar .qihao { font-weight: 700; font-size: 14px; }
        .latest-bar .result { font-size: 18px; font-weight: 700; }
        .latest-bar .result.red { color: var(--danger); }
        .latest-bar .result.green { color: var(--success); }
        .latest-bar .result.blue { color: var(--primary); }
        .latest-bar .sum { font-size: 12px; color: var(--text-secondary); }

        /* 模式选择 */
        .mode-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
        .mode-tab { flex: 1; padding: 10px; text-align: center; background: var(--bg); border: 2px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
        .mode-tab.active { border-color: var(--primary); background: rgba(59,130,246,0.1); color: var(--primary); }

        /* 组合选择 */
        .combo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .combo-item { display: flex; align-items: center; gap: 8px; padding: 10px; background: var(--bg); border: 2px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; }
        .combo-item.selected { border-color: var(--primary); background: rgba(59,130,246,0.08); }
        .combo-item.disabled { opacity: 0.3; pointer-events: none; }
        .combo-item .combo-odds { font-size: 11px; color: var(--text-secondary); margin-left: auto; }

        /* ABC球选择 */
        .abc-checks { display: flex; gap: 12px; margin-bottom: 12px; }
        .abc-check { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
        .abc-check input { width: 18px; height: 18px; accent-color: var(--primary); }

        /* 金额输入 */
        .amount-row { display: flex; align-items: center; gap: 8px; padding: 10px; background: var(--bg); border-radius: var(--radius-sm); margin-bottom: 6px; border: 1px solid var(--border); }
        .amount-row .combo-label { width: 50px; font-weight: 600; font-size: 13px; text-align: center; }
        .amount-row input { flex: 1; padding: 8px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; text-align: center; font-family: inherit; }
        .amount-row input.calculated { background: rgba(59,130,246,0.08); border-color: var(--primary); }
        .odds-low { color: var(--warning); font-size: 11px; }
        .odds-high { color: var(--purple); font-size: 11px; }

        /* 极值 */
        .extreme-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .extreme-item { padding: 8px 14px; background: var(--bg); border: 2px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 13px; }
        .extreme-item.selected { border-color: var(--primary); background: rgba(59,130,246,0.12); color: var(--primary); }

        /* 胜率显示 */
        .winrate-box { background: var(--bg); border: 1px solid var(--primary); border-radius: var(--radius-sm); padding: 10px 14px; margin: 10px 0; display: flex; align-items: center; gap: 10px; }
        .winrate-box .rate { font-size: 24px; font-weight: 700; color: var(--success); }
        .winrate-box .info { font-size: 12px; color: var(--text-secondary); }

        /* 日志 */
        .log-area { background: #0a0a0a; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 11px; line-height: 1.7; }
        .log-success { color: var(--success); }
        .log-error { color: var(--danger); }
        .log-info { color: var(--primary); }
        .log-warning { color: var(--warning); }

        .tip { font-size: 12px; color: var(--text-secondary); padding: 8px 12px; background: var(--bg); border-radius: var(--radius-sm); border-left: 3px solid var(--primary); margin-top: 8px; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="logo">小鶴神PC28<span>控制台 v3.0</span></div>
    <div class="topbar-right">
        <div class="account-indicator" id="accountIndicator">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">未登录</span>
        </div>
    </div>
</div>

<div class="main-container">

    <!-- 最新开奖 -->
    <div class="latest-bar" id="latestBar">
        <span>📊</span>
        <span class="qihao" id="latestQihao">加载中...</span>
        <span class="result" id="latestResult">--</span>
        <span class="sum" id="latestSum"></span>
    </div>

    <!-- 登录面板 -->
    <div class="card" id="panel-login">
        <div class="card-title"><span class="icon">🔐</span> 登录Telegram</div>
        <div class="form-group"><label class="form-label">手机号（含国际区号）</label><input type="tel" class="form-input" id="phoneInput" placeholder="+8613800138000" value="+86"></div>
        <div id="codeSection" class="hidden"><div class="form-group"><label class="form-label">验证码</label><input type="text" class="form-input" id="codeInput" placeholder="6位验证码" maxlength="6" inputmode="numeric"></div></div>
        <div id="passwordSection" class="hidden"><div class="form-group"><label class="form-label">两步验证密码</label><input type="password" class="form-input" id="passwordInput" placeholder="输入密码"></div></div>
        <button class="btn btn-primary" id="btnLogin" onclick="handleLogin()">📨 发送验证码</button>
    </div>

    <!-- 频道选择 -->
    <div class="card hidden" id="panel-channels">
        <div class="card-title"><span class="icon">💬</span> 选择频道</div>
        <div class="form-group"><label class="form-label">账号</label><select class="form-select" id="accountSelect" onchange="onAccountChange()"></select></div>
        <div class="form-group"><label class="form-label">频道</label><select class="form-select" id="channelSelect"></select>
        <button class="btn btn-outline btn-sm" style="margin-top:6px;" onclick="refreshChannels()">🔄 刷新</button></div>
        <button class="btn btn-primary" onclick="confirmChannel()" id="btnConfirmChannel" disabled>✅ 确认</button>
    </div>

    <!-- 投注设置 -->
    <div class="card hidden" id="panel-settings">
        <div class="card-title"><span class="icon">🎯</span> 投注设置</div>

        <!-- 模式切换 -->
        <div class="mode-tabs">
            <div class="mode-tab active" onclick="switchMode('kill')" id="tab-kill">🎯 杀组</div>
            <div class="mode-tab" onclick="switchMode('abc')" id="tab-abc">🔮 杀ABC球</div>
            <div class="mode-tab" onclick="switchMode('extreme')" id="tab-extreme">🎪 追极值</div>
        </div>

        <!-- 杀组设置 -->
        <div id="settings-kill">
            <div class="form-label">选择杀的组合 <button class="btn btn-outline btn-sm" onclick="refreshPrediction()">🔄 刷新预测</button></div>
            <div class="combo-grid">
                <div class="combo-item selected" id="kc-大单" onclick="toggleKill('大单')"><span>大单</span><span class="combo-odds">4.32</span></div>
                <div class="combo-item selected" id="kc-小单" onclick="toggleKill('小单')"><span>小单</span><span class="combo-odds">3.71</span></div>
                <div class="combo-item selected" id="kc-大双" onclick="toggleKill('大双')"><span>大双</span><span class="combo-odds">3.71</span></div>
                <div class="combo-item disabled" id="kc-小双" onclick="toggleKill('小双')"><span>小双</span><span class="combo-odds">4.32</span></div>
            </div>
            <div class="winrate-box" id="killWinrate" style="display:none;">
                <span>📈</span><span>当前模型胜率:</span><span class="rate" id="killRate">--%</span><span class="info" id="killModelInfo"></span>
            </div>
            <div class="form-label" style="margin-top:12px;">投注金额（输入一项自动计算）</div>
            <div id="amountInputs"></div>
        </div>

        <!-- 杀ABC球设置 -->
        <div id="settings-abc" class="hidden">
            <div class="abc-checks">
                <label class="abc-check"><input type="checkbox" id="abcA" checked onchange="refreshPrediction()"> A球</label>
                <label class="abc-check"><input type="checkbox" id="abcB" onchange="refreshPrediction()"> B球</label>
                <label class="abc-check"><input type="checkbox" id="abcC" onchange="refreshPrediction()"> C球</label>
                <button class="btn btn-outline btn-sm" onclick="refreshPrediction()">🔄 刷新</button>
            </div>
            <div id="abcResults"></div>
            <div class="form-group"><label class="form-label">每个号码金额</label><input type="number" class="form-input" id="abcAmount" value="1000" min="1"></div>
        </div>

        <!-- 追极值设置 -->
        <div id="settings-extreme" class="hidden">
            <div class="form-label">选择极值号码</div>
            <div class="extreme-grid" id="extremeGrid"></div>
            <div class="form-group"><label class="form-label">每个号码金额</label><input type="number" class="form-input" id="extremeAmount" value="1000" min="1"></div>
        </div>

        <!-- 通用 -->
        <div class="two-col" style="margin-top:12px;">
            <div class="form-group"><label class="form-label">倍投乘数</label><input type="number" class="form-input" id="multiplierInput" value="2.0" step="0.1"></div>
            <div class="form-group"><label class="form-label">最大倍投次数</label><input type="number" class="form-input" id="maxLossInput" value="5"></div>
        </div>
        <button class="btn btn-success" onclick="startBetting()">🚀 开始自动投注</button>
    </div>

    <!-- 运行监控 -->
    <div class="card hidden" id="panel-running">
        <div class="card-title"><span class="icon">📡</span> 运行中 <span class="tag tag-success" id="runStatus">Active</span></div>
        <div class="two-col">
            <div><div class="form-label">当前期号</div><div style="font-size:20px;font-weight:700;" id="runQihao">--</div></div>
            <div><div class="form-label">杀组目标</div><div style="font-size:20px;font-weight:700;color:var(--danger);" id="runKill">--</div></div>
        </div>
        <div style="margin-top:10px;"><div class="form-label">下注预览</div><div style="background:var(--bg);padding:10px;border-radius:var(--radius-sm);font-family:monospace;font-size:13px;" id="betPreview">--</div></div>
        <div style="margin-top:10px;"><div class="form-label">日志</div><div class="log-area" id="logArea"><div>🟢 就绪</div></div></div>
        <button class="btn btn-danger" onclick="stopBetting()" style="margin-top:12px;">🛑 停止</button>
    </div>

</div>

<script>
// ==================== 状态 ====================
const S = {
    isLoggedIn: false, currentPhone: '', phoneCodeHash: '',
    accounts: {}, selectedAccount: '', selectedChannel: {id:'',name:''},
    mode: 'kill', killedCombo: '小双', selectedExtremes: [],
    isRunning: false, lastQihao: '',
    amounts: {'大单':0,'小单':0,'大双':0,'小双':0},
    odds: {'大单':{rate:4.32,g:'high'},'小单':{rate:3.71,g:'low'},'大双':{rate:3.71,g:'low'},'小双':{rate:4.32,g:'high'}},
    ratioMap: {
        '杀小双':{calc(c,v){if(c==='小单')return{'小单':v,'大双':v,'大单':Math.round(v*0.8588)};if(c==='大单')return{'小单':Math.round(v/0.8588),'大双':Math.round(v/0.8588),'大单':v};return{'小单':v,'大双':v,'大单':Math.round(v*0.8588)};}},
        '杀大单':{calc(c,v){if(c==='小单')return{'小单':v,'大双':v,'小双':Math.round(v*0.8588)};if(c==='小双')return{'小单':Math.round(v/0.8588),'大双':Math.round(v/0.8588),'小双':v};return{'小单':v,'大双':v,'小双':Math.round(v*0.8588)};}},
        '杀大双':{calc(c,v){if(c==='小单')return{'小单':v,'小双':Math.round(v*0.6974),'大单':Math.round(v*0.6974)};if(c==='小双')return{'小单':Math.round(v/0.6974),'小双':v,'大单':v};return{'小单':Math.round(v/0.6974),'小双':v,'大单':v};}},
        '杀小单':{calc(c,v){if(c==='大双')return{'大双':v,'小双':Math.round(v*0.6974),'大单':Math.round(v*0.6974)};if(c==='小双')return{'大双':Math.round(v/0.6974),'小双':v,'大单':v};return{'大双':Math.round(v/0.6974),'小双':v,'大单':v};}},
    },
};
const COMBOS = ['大单','小单','大双','小双'];
const EX = [0,1,2,3,4,23,24,25,26,27];

// ==================== WebSocket ====================
let ws, wsId = 'pc28_' + Date.now();
function connectWS() {
    ws = new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/${wsId}`);
    ws.onopen = () => log('success','已连接服务器');
    ws.onmessage = e => { try { handleMsg(JSON.parse(e.data)); } catch(ex) {} };
    ws.onclose = () => { log('warning','断开，3秒后重连...'); setTimeout(connectWS, 3000); };
}
function handleMsg(d) {
    console.log('MSG:', d.type, d);
    if (d.type === 'connected') { log('info', d.message); getLatest(); }
    else if (d.type === 'saved_sessions') {
        d.accounts.forEach(a => S.accounts[a.phone] = {phone:a.phone, name:a.name, channels:[]});
        if (d.accounts.length > 0) {
            S.isLoggedIn = true; S.selectedAccount = d.accounts[0].phone;
            updateLoginUI(d.accounts[0].name);
            ws.send(JSON.stringify({type:'get_channels', phone:d.accounts[0].phone}));
            showPanel('channels');
        }
    }
    else if (d.type === 'send_code_result') {
        document.getElementById('btnLogin').disabled = false;
        if (d.already_logged_in) { handleLoginSuccess(d); return; }
        if (d.success) { S.currentPhone = d.phone; document.getElementById('codeSection').classList.remove('hidden'); document.getElementById('btnLogin').textContent='🔓 验证登录'; document.getElementById('codeInput').focus(); log('success','验证码已发送'); }
        else { document.getElementById('btnLogin').textContent='📨 发送验证码'; log('error', d.error); }
    }
    else if (d.type === 'verify_code_result') {
        document.getElementById('btnLogin').disabled = false;
        if (d.need_password) { document.getElementById('codeSection').classList.add('hidden'); document.getElementById('passwordSection').classList.remove('hidden'); document.getElementById('btnLogin').textContent='🔒 提交密码'; }
        else if (d.success) handleLoginSuccess(d);
        else { document.getElementById('btnLogin').textContent='🔓 验证登录'; log('error', d.error); }
    }
    else if (d.type === 'verify_password_result') {
        document.getElementById('btnLogin').disabled = false;
        if (d.success) handleLoginSuccess(d);
        else log('error', d.error);
    }
    else if (d.type === 'channels' && d.success) {
        const acc = S.accounts[S.selectedAccount]; if (acc) { acc.channels = d.data; updateChannelSelect(); log('success', `获取到 ${d.data.length} 个群组`); }
    }
    else if (d.type === 'latest_data' && d.latest) {
        document.getElementById('latestQihao').textContent = '期号: ' + d.latest.qihao;
        document.getElementById('latestResult').textContent = d.latest.combo + ' (' + d.latest.sum + ')';
        document.getElementById('latestSum').textContent = d.latest.number || '';
        if (d.latest.sum >= 14) document.getElementById('latestResult').className = 'result red';
        else document.getElementById('latestResult').className = 'result green';
    }
    else if (d.type === 'prediction') {
        if (d.mode === 'kill') {
            S.killedCombo = d.kill_target;
            updateKillUI();
            document.getElementById('killRate').textContent = d.win_rate + '%';
            document.getElementById('killModelInfo').textContent = '模型#' + d.model_id;
            document.getElementById('killWinrate').style.display = 'flex';
            document.getElementById('latestQihao').textContent = '期号: ' + d.latest_qihao;
            document.getElementById('latestResult').textContent = d.latest_combo + ' (' + d.latest_sum + ')';
        }
        else if (d.mode === 'abc') {
            let html = '';
            for (const [ball, r] of Object.entries(d.results)) {
                html += `<div class="winrate-box" style="margin-bottom:6px;">
                    <span>${ball}球</span><span>杀:</span><strong style="color:var(--danger);">${r.kill_num}</strong>
                    <span class="rate">${r.win_rate}%</span>
                    <span class="info">投: ${r.bet_nums.join(',')}</span>
                </div>`;
            }
            document.getElementById('abcResults').innerHTML = html || '<div class="tip">点击刷新获取预测</div>';
            document.getElementById('latestQihao').textContent = '期号: ' + d.latest_qihao;
        }
    }
    else if (d.type === 'betting_started' && d.success) { S.isRunning = true; showPanel('running'); updateBetPreview(); log('success','🚀 自动投注已启动'); }
    else if (d.type === 'betting_stopped') { S.isRunning = false; log('warning','🛑 已停止'); }
    else if (d.type === 'bet_log') { log(d.error?'error':'info', d.message); }
}
function handleLoginSuccess(d) {
    S.isLoggedIn = true; S.currentPhone = d.phone;
    if (!S.accounts[d.phone]) S.accounts[d.phone] = {phone:d.phone, name:d.name, channels:[]};
    S.accounts[d.phone].name = d.name; S.selectedAccount = d.phone;
    updateLoginUI(d.name);
    document.getElementById('codeSection').classList.add('hidden');
    document.getElementById('passwordSection').classList.add('hidden');
    document.getElementById('btnLogin').textContent = '📨 发送验证码'; document.getElementById('btnLogin').disabled = false;
    log('success', `✅ 登录成功：${d.name}`);
    ws.send(JSON.stringify({type:'get_channels', phone:d.phone}));
    showPanel('channels');
}
function updateLoginUI(name) {
    document.getElementById('statusDot').classList.add('online');
    document.getElementById('statusText').textContent = name + ' · 已登录';
}

// ==================== 登录 ====================
function handleLogin() {
    const phone = document.getElementById('phoneInput').value.trim();
    if (!phone.startsWith('+')) { log('error','请输入正确手机号'); return; }
    if (!ws || ws.readyState !== 1) { connectWS(); return; }
    const btn = document.getElementById('btnLogin');
    if (!document.getElementById('codeSection').classList.contains('hidden')) {
        const code = document.getElementById('codeInput').value.trim();
        if (!code) { log('error','请输入验证码'); return; }
        btn.disabled = true; btn.textContent = '⏳';
        ws.send(JSON.stringify({type:'verify_code', code}));
    } else if (!document.getElementById('passwordSection').classList.contains('hidden')) {
        const pw = document.getElementById('passwordInput').value.trim();
        if (!pw) { log('error','请输入密码'); return; }
        btn.disabled = true; btn.textContent = '⏳';
        ws.send(JSON.stringify({type:'verify_password', password:pw}));
    } else {
        btn.disabled = true; btn.textContent = '⏳ 发送中...';
        ws.send(JSON.stringify({type:'send_code', phone}));
    }
}

// ==================== 面板切换 ====================
function showPanel(name) {
    ['login','channels','settings','running'].forEach(n => document.getElementById('panel-'+n).classList.toggle('hidden', n !== name));
    if (name === 'channels') { updateAccountSelect(); }
    if (name === 'settings') { renderAmountInputs(); refreshPrediction(); }
    if (name === 'running') updateBetPreview();
}

// ==================== 频道 ====================
function updateAccountSelect() {
    const s = document.getElementById('accountSelect');
    s.innerHTML = '<option value="">-- 选择账号 --</option>';
    for (const [p,a] of Object.entries(S.accounts)) {
        const o = document.createElement('option'); o.value = p; o.textContent = a.name + ' (' + p + ')';
        if (p === S.selectedAccount) o.selected = true;
        s.appendChild(o);
    }
    if (S.selectedAccount) updateChannelSelect();
}
function onAccountChange() { S.selectedAccount = document.getElementById('accountSelect').value; if (S.selectedAccount) updateChannelSelect(); checkChannelConfirm(); }
function updateChannelSelect() {
    const s = document.getElementById('channelSelect');
    s.innerHTML = '<option value="">-- 选择频道 --</option>';
    const acc = S.accounts[S.selectedAccount];
    if (acc && acc.channels) acc.channels.forEach(c => { const o = document.createElement('option'); o.value = JSON.stringify({id:c.id, name:c.name}); o.textContent = (c.type==='channel'?'📢':'👥') + c.name; s.appendChild(o); });
}
function refreshChannels() { if (S.selectedAccount && ws && ws.readyState===1) { log('info','刷新中...'); ws.send(JSON.stringify({type:'get_channels', phone:S.selectedAccount})); } }
function checkChannelConfirm() { document.getElementById('btnConfirmChannel').disabled = !S.selectedAccount || !document.getElementById('channelSelect').value; }
function confirmChannel() {
    try { S.selectedChannel = JSON.parse(document.getElementById('channelSelect').value); log('success','已选择: '+S.selectedChannel.name); showPanel('settings'); }
    catch(e) { log('error','选择无效'); }
}
document.addEventListener('change', e => { if (e.target.id === 'channelSelect') checkChannelConfirm(); });

// ==================== 模式 ====================
function switchMode(m) {
    S.mode = m;
    document.getElementById('tab-kill').classList.toggle('active', m==='kill');
    document.getElementById('tab-abc').classList.toggle('active', m==='abc');
    document.getElementById('tab-extreme').classList.toggle('active', m==='extreme');
    document.getElementById('settings-kill').classList.toggle('hidden', m!=='kill');
    document.getElementById('settings-abc').classList.toggle('hidden', m!=='abc');
    document.getElementById('settings-extreme').classList.toggle('hidden', m!=='extreme');
    if (m === 'kill') renderAmountInputs();
    refreshPrediction();
}

// ==================== 杀组 ====================
function toggleKill(c) {
    S.killedCombo = c; updateKillUI(); renderAmountInputs();
}
function updateKillUI() {
    COMBOS.forEach(c => {
        const el = document.getElementById('kc-'+c);
        el.classList.remove('selected','disabled');
        if (c === S.killedCombo) el.classList.add('disabled');
        else el.classList.add('selected');
    });
}

// ==================== 金额 ====================
function renderAmountInputs() {
    if (S.mode !== 'kill') return;
    const combos = COMBOS.filter(c => c !== S.killedCombo);
    let html = '';
    combos.forEach(c => {
        const o = S.odds[c];
        html += `<div class="amount-row">
            <span class="combo-label">${c}</span><span class="${o.g==='low'?'odds-low':'odds-high'}">${o.rate}</span>
            <input type="number" id="amt-${c}" value="${S.amounts[c]||''}" placeholder="金额" oninput="onAmt('${c}',this.value)" inputmode="numeric">
        </div>`;
    });
    html += '<div class="tip">💡 输入任意一项自动计算其余（赔率联动）</div>';
    document.getElementById('amountInputs').innerHTML = html;
}
function onAmt(combo, val) {
    if (!val || val <= 0) { COMBOS.forEach(c => S.amounts[c]=0); renderAmountInputs(); return; }
    const rk = '杀' + S.killedCombo;
    const rd = S.ratioMap[rk];
    if (!rd) return;
    const res = rd.calc(combo, parseInt(val));
    for (const [c,a] of Object.entries(res)) S.amounts[c] = a;
    S.amounts[S.killedCombo] = 0;
    renderAmountInputs();
}

// ==================== 极值 ====================
function initExtreme() {
    const g = document.getElementById('extremeGrid');
    EX.forEach(n => {
        const el = document.createElement('div'); el.className = 'extreme-item'; el.textContent = n;
        el.onclick = () => {
            const i = S.selectedExtremes.indexOf(n);
            if (i >= 0) { S.selectedExtremes.splice(i,1); el.classList.remove('selected'); }
            else { S.selectedExtremes.push(n); el.classList.add('selected'); }
        };
        el.id = 'ex-'+n; g.appendChild(el);
    });
}

// ==================== 预测 ====================
function refreshPrediction() {
    if (!ws || ws.readyState !== 1) return;
    if (S.mode === 'kill') ws.send(JSON.stringify({type:'get_prediction', mode:'kill'}));
    else if (S.mode === 'abc') {
        const balls = [];
        if (document.getElementById('abcA').checked) balls.push('A');
        if (document.getElementById('abcB').checked) balls.push('B');
        if (document.getElementById('abcC').checked) balls.push('C');
        ws.send(JSON.stringify({type:'get_prediction', mode:'abc', balls}));
    }
}
function getLatest() { if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:'get_latest'})); }

// ==================== 投注 ====================
function startBetting() {
    if (!S.isLoggedIn) { log('error','请先登录'); showPanel('login'); return; }
    if (!S.selectedChannel.id) { log('error','请先选择频道'); showPanel('channels'); return; }
    if (S.mode === 'kill') {
        const combos = COMBOS.filter(c => c !== S.killedCombo);
        if (!combos.some(c => S.amounts[c] > 0)) { log('error','请输入金额'); return; }
    }
    const cfg = {
        mode: S.mode, killedCombo: S.killedCombo, amounts: S.amounts,
        extremeNumbers: S.selectedExtremes, extremeAmount: parseInt(document.getElementById('extremeAmount')?.value || 1000),
        abcAmount: parseInt(document.getElementById('abcAmount')?.value || 1000),
        balls: [], multiplier: parseFloat(document.getElementById('multiplierInput').value),
    };
    if (S.mode === 'abc') {
        if (document.getElementById('abcA').checked) cfg.balls.push('A');
        if (document.getElementById('abcB').checked) cfg.balls.push('B');
        if (document.getElementById('abcC').checked) cfg.balls.push('C');
    }
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:'start_betting', phone:S.selectedAccount, channel_id:S.selectedChannel.id, mode:S.mode, config:cfg}));
}
function stopBetting() {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:'stop_betting', phone:S.selectedAccount, channel_id:S.selectedChannel.id}));
    S.isRunning = false; document.getElementById('runStatus').textContent = '已停止';
}
function updateBetPreview() {
    let p = '';
    if (S.mode === 'kill') p = COMBOS.filter(c => c !== S.killedCombo).map(c => c+S.amounts[c]).join(' ');
    else if (S.mode === 'extreme') p = S.selectedExtremes.map(n => n+'/'+(document.getElementById('extremeAmount')?.value||1000)).join('\n');
    else if (S.mode === 'abc') {
        const balls = []; if (document.getElementById('abcA').checked) balls.push('A'); if (document.getElementById('abcB').checked) balls.push('B'); if (document.getElementById('abcC').checked) balls.push('C');
        const amt = document.getElementById('abcAmount')?.value || 1000;
        p = balls.map(b => b+'球: 0-9各'+amt).join('\n');
    }
    document.getElementById('betPreview').textContent = p || '--';
    document.getElementById('runKill').textContent = S.mode === 'kill' ? S.killedCombo : '--';
}

// ==================== 日志 ====================
function log(type, msg) {
    const a = document.getElementById('logArea');
    const t = new Date().toLocaleTimeString();
    a.innerHTML += `<div class="log-${type}">[${t}] ${msg}</div>`;
    a.scrollTop = a.scrollHeight;
}

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', () => {
    connectWS();
    initExtreme();
    renderAmountInputs();
    setInterval(getLatest, 30000);
});
</script>
</body>
